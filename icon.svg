<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9">
    <!-- Spider web arcs -->
    <path d="M0,-160 Q80,-80 0,0 Q-80,-80 0,-160Z" opacity="0.6"/>
    <path d="M160,0 Q80,80 0,0 Q80,-80 160,0Z" opacity="0.6"/>
    <path d="M0,160 Q-80,80 0,0 Q80,80 0,160Z" opacity="0.6"/>
    <path d="M-160,0 Q-80,-80 0,0 Q-80,80 -160,0Z" opacity="0.6"/>
    <!-- Radial lines -->
    <line x1="0" y1="-160" x2="0" y2="160" opacity="0.4"/>
    <line x1="-160" y1="0" x2="160" y2="0" opacity="0.4"/>
    <line x1="-113" y1="-113" x2="113" y2="113" opacity="0.4"/>
    <line x1="113" y1="-113" x2="-113" y2="113" opacity="0.4"/>
    <!-- Concentric circles -->
    <circle cx="0" cy="0" r="80" opacity="0.5"/>
    <circle cx="0" cy="0" r="160" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="none"/>
  </g>
</svg>
